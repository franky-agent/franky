version: 2

project_name: franky

builds:
  - id: release
    builder: zig
    command: build
    targets:
      - x86_64-linux-gnu
      - aarch64-linux-gnu
      - x86-linux-gnu
      - x86_64-macos
      - aarch64-macos
    flags:
      - -Doptimize=ReleaseSafe
      - -Dversion={{ .Version }}
      - -Dcommit={{ .ShortCommit }}
      - -Ddate={{ .CommitDate }}
  - id: debug
    builder: zig
    command: build
    targets:
      - x86_64-linux-gnu
      - aarch64-linux-gnu
      - x86-linux-gnu
      - x86_64-macos
      - aarch64-macos
    flags:
      - -Doptimize=ReleaseSafe
      - -Dversion={{ .Version }}
      - -Dcommit={{ .ShortCommit }}
      - -Ddate={{ .CommitDate }}
    # NOTE: -Doptimize=Debug hangs under gvisor sandboxes (Zig 0.17-dev
    # std.Io.Threaded futex backoff bug). ReleaseSafe retains all safety
    # checks and full source-location stacktraces via the custom panic
    # handler in src/bin/main.zig, making it suitable for debugging.
archives:
  - id: release
    ids: [release]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ if eq .Arch \"x86\" }}386{{ else }}{{ .Arch }}{{ end }}"
  - id: debug
    ids: [debug]
    formats: [binary]
    name_template: "{{ .ProjectName }}-debug_{{ .Os }}_{{ if eq .Arch \"x86\" }}386{{ else }}{{ .Arch }}{{ end }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
